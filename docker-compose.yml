services:
  # Python Machine Learning Microservice
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: agrismart-ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - GROQ_API_KEY=${GROQ_API_KEY}
    networks:
      - agrismart-network

  # Node.js / Express Backend Gateway
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: agrismart-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      # Connecting to pre-existing Database (configured in .env file)
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - JWT_SECRET=${JWT_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ML_SERVICE_URL=http://ml-service:8000
    extra_hosts:
      # Allows container to reach host system's database via host.docker.internal
      - "host.docker.internal:host-gateway"
    volumes:
      - ./server/public/uploads:/app/public/uploads
    depends_on:
      - ml-service
    networks:
      - agrismart-network

  # React Frontend (Nginx Static Server + API Proxy)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: agrismart-client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - agrismart-network

networks:
  agrismart-network:
    driver: bridge
